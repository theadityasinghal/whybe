services:
  - type: web
    name: whybe-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MPLCONFIGDIR
        value: /tmp/mpl_cache
      - key: PYTHON_VERSION
        value: 3.11.9
